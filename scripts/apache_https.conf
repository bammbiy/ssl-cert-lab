# ============================================================
# 05_apache_https.conf
# Apache HTTPS 설정 예시
#
# 사용법:
#   sudo cp 05_apache_https.conf /etc/apache2/sites-available/mysite-ssl.conf
#   sudo a2enmod ssl rewrite headers
#   sudo a2ensite mysite-ssl
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# ============================================================

# HTTP → HTTPS 리다이렉트
<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# HTTPS 메인 설정
<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    DocumentRoot /var/www/html

    # ── 인증서 경로 ──────────────────────────────────────────
    # Let's Encrypt 사용 시
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/your-domain.com/cert.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/your-domain.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/your-domain.com/chain.pem

    # 사설 CA 사용 시 (위 세 줄 주석 처리하고 아래 사용)
    # SSLCertificateFile    /path/to/server/server.crt
    # SSLCertificateKeyFile /path/to/server/server.key

    # ── SSL 보안 설정 ─────────────────────────────────────────
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # ── 보안 헤더 ────────────────────────────────────────────
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>