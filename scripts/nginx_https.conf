# ============================================================
# 04_nginx_https.conf
# Nginx HTTPS 설정 예시
#
# 사용법:
#   sudo cp 04_nginx_https.conf /etc/nginx/sites-available/mysite
#   sudo ln -s /etc/nginx/sites-available/mysite /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # HTTPS로 강제 리다이렉트
    return 301 https://$host$request_uri;
}

# HTTPS 메인 설정
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name your-domain.com www.your-domain.com;

    # ── 인증서 경로 ──────────────────────────────────────────
    # Let's Encrypt 사용 시
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 사설 CA 사용 시 (위 두 줄 주석 처리하고 아래 사용)
    # ssl_certificate     /path/to/server/server.crt;
    # ssl_certificate_key /path/to/server/server.key;

    # ── SSL 보안 설정 (SSL Labs A+ 목표) ──────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL 세션 캐시 (성능 개선)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (인증서 유효성 확인 속도 개선)
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── 보안 헤더 ────────────────────────────────────────────
    # HSTS: 브라우저가 이 도메인은 항상 HTTPS로 접속하도록 기억
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # ── 루트 디렉토리 설정 ────────────────────────────────────
    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}